<div class="chat-wrapper">
    <div class="top-bar">
        <div class="model-selector">
            <span class="gemini-text">MichellAI</span>
            <span class="material-symbols-outlined dropdown-icon">expand_more</span>
        </div>

        <div class="right-actions">
            <button class="upgrade-btn">
                <span class="material-symbols-outlined icon">sparkle</span>
                Upgrade til bigbrain for 200kr om måneden
            </button>
            <div class="profile-icon">
                <span class="material-symbols-outlined">person</span>
            </div>
        </div>
    </div>

    <div class="scroll-container">
        <div class="content-width">
            <div class="greeting-container">
                <h2 class="greeting-pre">Hej Michella</h2>
                <h1 class="greeting-main">Hvor skal vi starte?</h1>
            </div>
            
            <div class="input-area-wrapper">
                <app-input-area></app-input-area>
            </div>

            <div class="suggestions-chips">
                <div class="suggestion-chip">
                    <span class="emoji">🖼️</span>
                    <span class="chip-text">Opret billede</span>
                </div>
                <div class="suggestion-chip">
                    <span class="emoji">🎸</span>
                    <span class="chip-text">Skab musik</span>
                </div>
                <div class="suggestion-chip">
                    <span class="chip-text">Hjælp mig med at lære</span>
                </div>
                <div class="suggestion-chip">
                    <span class="chip-text">Skriv hvad som helst</span>
                </div>
                <div class="suggestion-chip">
                    <span class="chip-text">Boost min dag</span>
                </div>
            </div>
        </div>
    </div>
</div>
